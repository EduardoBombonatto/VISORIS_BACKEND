$kind: http-request
name: 'POST /reports on Appointment A as User B (-> 404)'
method: POST
url: '{{base_url}}/api/v1/reports'
order: 14000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userB_access}}; refreshToken={{userB_refresh}}'
body:
  type: json
  content: |-
    {"appointment_id":{{apptA_id}},"content":"Cross"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Cross-user returns 404 Not Found (never 403, 200, or 500)', () => {
        pm.expect(pm.response.code).to.eql(404);
      });
