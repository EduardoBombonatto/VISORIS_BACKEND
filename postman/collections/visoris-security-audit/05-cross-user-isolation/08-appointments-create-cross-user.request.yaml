$kind: http-request
name: 'POST /appointments on Clinic/Patient A as User B (-> 404)'
method: POST
url: '{{base_url}}/api/v1/appointments'
order: 8000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userB_access}}; refreshToken={{userB_refresh}}'
body:
  type: json
  content: |-
    {"clinic_id":{{clinicA_id}},"patient_id":{{patientA_id}},"scheduled_at":"2026-12-03T10:00:00Z","procedure_name":"Cross"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Cross-user returns 404 Not Found (never 403, 200, or 500)', () => {
        pm.expect(pm.response.code).to.eql(404);
      });
