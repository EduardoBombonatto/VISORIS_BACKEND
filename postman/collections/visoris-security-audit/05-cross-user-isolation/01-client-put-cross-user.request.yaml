$kind: http-request
name: 'PUT /clients/:id as User B (-> 404)'
method: PUT
url: '{{base_url}}/api/v1/clients/{{clientA_id}}'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userB_access}}; refreshToken={{userB_refresh}}'
body:
  type: json
  content: |-
    {"full_name":"Hijack","document_cpf":"12345678909","email":"h@visoris.dev","phone":"11999999999"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Cross-user returns 404 Not Found (never 403, 200, or 500)', () => {
        pm.expect(pm.response.code).to.eql(404);
      });
