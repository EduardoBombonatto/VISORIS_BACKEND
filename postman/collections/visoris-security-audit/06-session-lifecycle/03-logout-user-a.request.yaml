$kind: http-request
name: 'POST /auth/logout (User A -> 200)'
method: POST
url: '{{base_url}}/api/v1/auth/logout'
order: 3000
headers:
  - key: 'Cookie'
    value: 'refreshToken={{userA_refresh}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Logout succeeds (200)', () => pm.expect(pm.response.code).to.eql(200));
