$kind: http-request
name: 'POST /patients (User A creates Patient A)'
method: POST
url: '{{base_url}}/api/v1/patients'
order: 6000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"client_id":{{clientA_id}},"name":"Rex Audit","patient_type":"PET","birth_date":"2022-05-01","biological_details":{"breed":"Labrador","coat_color":"Dourado"}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Patient A created (201)', () => pm.expect(pm.response.code).to.eql(201));
      const body = pm.response.json();
      if (body && body.data && body.data.patient && body.data.patient.id) {
        pm.collectionVariables.set('patientA_id', String(body.data.patient.id));
      }
