$kind: http-request
name: 'POST /reports (User A creates Report A draft)'
method: POST
url: '{{base_url}}/api/v1/reports'
order: 9000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"appointment_id":{{apptA_id}},"content":"Rascunho inicial do laudo."}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Report A created (201)', () => pm.expect(pm.response.code).to.eql(201));
      const body = pm.response.json();
      if (body && body.data && body.data.id) {
        pm.collectionVariables.set('reportA_id', String(body.data.id));
      }
