$kind: http-request
name: 'POST /appointments (User A creates Appointment A)'
method: POST
url: '{{base_url}}/api/v1/appointments'
order: 7000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"clinic_id":{{clinicA_id}},"patient_id":{{patientA_id}},"scheduled_at":"2026-12-01T14:00:00Z","procedure_name":"Endoscopia Digestiva","price":350.00}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Appointment A created (201)', () => pm.expect(pm.response.code).to.eql(201));
      const body = pm.response.json();
      if (body && body.data && body.data.appointment && body.data.appointment.id) {
        pm.collectionVariables.set('apptA_id', String(body.data.appointment.id));
      }
