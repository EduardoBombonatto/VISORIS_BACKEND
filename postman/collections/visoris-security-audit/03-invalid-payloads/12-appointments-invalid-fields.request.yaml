$kind: http-request
name: 'POST /appointments (negative price + bad date -> 400)'
method: POST
url: '{{base_url}}/api/v1/appointments'
order: 12000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"clinic_id":{{clinicA_id}},"patient_id":{{patientA_id}},"scheduled_at":"not-a-date","procedure_name":"","price":-10}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 400 Bad Request (no 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
