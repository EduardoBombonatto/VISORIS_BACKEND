$kind: http-request
name: 'POST /reports/:id/images (empty url + negative order -> 400)'
method: POST
url: '{{base_url}}/api/v1/reports/{{reportA_id}}/images'
order: 20000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"image_url":"","display_order":-1}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 400 Bad Request (no 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
