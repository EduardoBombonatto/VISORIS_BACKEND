$kind: http-request
name: 'PUT /clients/:id (invalid fields -> 400)'
method: PUT
url: '{{base_url}}/api/v1/clients/{{clientA_id}}'
order: 9000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"full_name":"X","document_cpf":"1","email":"no","phone":"1"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 400 Bad Request (no 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
