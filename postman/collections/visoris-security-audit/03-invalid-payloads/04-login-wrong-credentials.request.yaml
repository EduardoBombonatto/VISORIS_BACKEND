$kind: http-request
name: 'POST /auth/login (wrong password -> 401)'
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 4000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {"email":"{{userA_email}}","password":"Wrong!Password9"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 401 Unauthorized (no 500)', () => {
        pm.expect(pm.response.code).to.eql(401);
      });
