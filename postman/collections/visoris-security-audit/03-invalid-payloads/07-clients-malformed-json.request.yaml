$kind: http-request
name: 'POST /clients (malformed JSON -> 400)'
method: POST
url: '{{base_url}}/api/v1/clients'
order: 7000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: text
  content: |-
    {bad
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 400 Bad Request (no 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
