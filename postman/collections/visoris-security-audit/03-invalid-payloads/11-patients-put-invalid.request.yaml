$kind: http-request
name: 'PUT /patients/:id (missing PET fields -> 400)'
method: PUT
url: '{{base_url}}/api/v1/patients/{{patientA_id}}'
order: 11000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"name":"Rex","patient_type":"PET","biological_details":{}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 400 Bad Request (no 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
