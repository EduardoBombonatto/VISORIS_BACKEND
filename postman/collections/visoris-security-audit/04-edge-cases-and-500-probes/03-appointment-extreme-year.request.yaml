$kind: http-request
name: 'PROBE #22: POST /appointments (extreme ISO year +999999)'
method: POST
url: '{{base_url}}/api/v1/appointments'
order: 3000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
body:
  type: json
  content: |-
    {"clinic_id":{{clinicA_id}},"patient_id":{{patientA_id}},"scheduled_at":"+999999-01-01T00:00:00Z","procedure_name":"Extreme Date"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Server does not crash with 500', () => {
        pm.expect(pm.response.code).to.be.below(500);
      });

      pm.test('Extreme ISO year should be rejected with 400 (not 500)', () => {
        pm.expect(pm.response.code).to.eql(400);
      });
