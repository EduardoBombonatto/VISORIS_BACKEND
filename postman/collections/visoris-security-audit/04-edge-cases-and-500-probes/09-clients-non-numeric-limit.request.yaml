$kind: http-request
name: 'PROBE #23: GET /clients?limit=abc (JSON 400 vs plain 404)'
method: GET
url: '{{base_url}}/api/v1/clients?limit=abc'
order: 9000
headers:
  - key: 'Cookie'
    value: 'accessToken={{userA_access}}; refreshToken={{userA_refresh}}'
queryParams:
  - key: 'limit'
    value: 'abc'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Server does not crash with 500', () => {
        pm.expect(pm.response.code).to.be.below(500);
      });

      pm.test('Non-numeric limit should return 400 JSON (not 404 plain text)', () => {
        pm.expect(pm.response.code).to.eql(400);
        pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json');
      });
