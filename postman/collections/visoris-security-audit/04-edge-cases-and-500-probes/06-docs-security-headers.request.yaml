$kind: http-request
name: 'PROBE #24: GET /docs (check HTTP security headers)'
method: GET
url: '{{base_url}}/api/v1/docs'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Server does not crash with 500', () => {
        pm.expect(pm.response.code).to.be.below(500);
      });

      pm.test('Security header X-Content-Type-Options: nosniff present', () => {
        pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff');
      });
      pm.test('Security header X-Frame-Options present', () => {
        pm.expect(pm.response.headers.get('X-Frame-Options')).to.be.a('string').and.not.empty;
      });
