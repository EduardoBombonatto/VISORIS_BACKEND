$kind: http-request
name: 'PROBE #8: POST /auth/login (User-Agent > 255 chars)'
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'User-Agent'
    value: ''
body:
  type: json
  content: |-
    {"email":"{{userA_email}}","password":"Strong!Pass1"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Server does not crash with 500', () => {
        pm.expect(pm.response.code).to.be.below(500);
      });

      pm.test('Oversized User-Agent does not crash login (expect 200)', () => {
        pm.expect(pm.response.code).to.eql(200);
      });
