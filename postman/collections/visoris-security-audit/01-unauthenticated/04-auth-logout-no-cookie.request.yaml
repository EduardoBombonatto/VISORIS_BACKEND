$kind: http-request
name: 'POST /auth/logout (no cookie -> 200)'
method: POST
url: '{{base_url}}/api/v1/auth/logout'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Logout without cookie is idempotent 200', () => pm.expect(pm.response.code).to.eql(200));
