$kind: http-request
name: 'GET /auth/me (no cookie -> 401)'
method: GET
url: '{{base_url}}/api/v1/auth/me'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 401 Unauthorized (no 500)', () => {
        pm.expect(pm.response.code).to.eql(401);
      });
