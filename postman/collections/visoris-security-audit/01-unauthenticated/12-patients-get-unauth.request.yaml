$kind: http-request
name: 'GET /patients (no auth -> 401)'
method: GET
url: '{{base_url}}/api/v1/patients?clientId=1'
order: 12000
queryParams:
  - key: 'clientId'
    value: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 401 Unauthorized (no 500)', () => {
        pm.expect(pm.response.code).to.eql(401);
      });
