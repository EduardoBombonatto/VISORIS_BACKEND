version: '3.8'

services:
  # ==========================================
  # 1. Nossa API em Scala
  # ==========================================
  api:
    build: .
    container_name: visoris-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - minio

  # ==========================================
  # 2. Banco de Dados (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: visoris_db
    restart: unless-stopped
    environment:
      # Puxando as credenciais do .env
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ==========================================
  # 3. Armazenamento de Imagens (MinIO / S3 Local)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: visoris_storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # Porta da API (usada pelo backend)
      - "9001:9001" # Porta do painel de administração web
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

# Declaração dos volumes persistentes
volumes:
  postgres_data:
  minio_data: